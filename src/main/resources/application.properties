quarkus.http.port=8080
quarkus.http.limits.max-body-size=200K
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://kata-dev.ourhyt.art,http://localhost:4200
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,X-API-KEY
quarkus.http.cors.access-control-max-age=24H

migration.api-key=${MIGRATION_API_KEY:dev-api-key}
migration.payload.max-bytes=204800
migration.payload.max-lines=5000

quarkus.lambda.handler=default

conversions.ddb-table=${DDB_TABLE:kata-converter-jobs-qa}
conversions.artifact-bucket=${ARTIFACT_BUCKET:kata-converter-artifacts-qa}
conversions.queue-url=${QUEUE_URL:https://sqs.us-east-1.amazonaws.com/827164363053/kata-converter-jobs-qa}
conversions.mcp-base-url=${MCP_BASE_URL:}
conversions.presign-ttl-minutes=${PRESIGN_TTL_MINUTES:15}
conversions.job-ttl-days=${JOB_TTL_DAYS:7}
